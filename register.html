<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --text-dark: #172554;
        --text-muted: #64748b;
        --border: #e2e8f0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f8faff;
        color: var(--text-dark);
      }

      /* Navbar */
      .shop-navbar {
        width: 100%;
        min-height: 76px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 15px 6%;
        background: #fff;
        border-bottom: 1px solid #eaf0fb;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--text-dark);
        text-decoration: none;
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -0.8px;
        white-space: nowrap;
      }

      .brand-icon {
        width: 43px;
        height: 43px;
        display: grid;
        place-items: center;
        color: #fff;
        background: linear-gradient(135deg, #60a5fa, #2563eb);
        border-radius: 13px;
        font-size: 23px;
        box-shadow: 0 6px 14px rgba(37, 99, 235, 0.2);
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 27px;
      }

      .nav-links a {
        color: #475569;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .nav-links a:hover {
        color: var(--primary);
      }

      .login-link {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 11px 17px;
        border: 1px solid #dbeafe;
        border-radius: 10px;
        color: var(--primary);
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
        transition: 0.2s ease;
      }

      .login-link:hover {
        background: #eff6ff;
        border-color: #bfdbfe;
      }

      /* Main Layout */
      .register-page {
        width: 100%;
        min-height: calc(100vh - 76px);
        display: grid;
        grid-template-columns: 1fr 0.95fr;
      }

      /* Left Shopping Panel */
      .shopping-panel {
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 45px 7%;
        background:
          radial-gradient(
            circle at 85% 20%,
            rgba(255, 255, 255, 0.8) 0,
            transparent 22%
          ),
          linear-gradient(145deg, #dbeafe 0%, #eff6ff 50%, #bfdbfe 100%);
      }

      .shopping-panel::before {
        content: "";
        position: absolute;
        width: 300px;
        height: 300px;
        top: -120px;
        right: -110px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.45);
      }

      .shopping-panel::after {
        content: "";
        position: absolute;
        width: 340px;
        height: 340px;
        bottom: -200px;
        left: -120px;
        border-radius: 50%;
        background: rgba(59, 130, 246, 0.12);
      }

      .panel-content {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 560px;
        margin: auto;
      }

      .offer-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        margin-bottom: 22px;
        border: 1px solid rgba(37, 99, 235, 0.12);
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.72);
        color: #1d4ed8;
        font-size: 12px;
        font-weight: 700;
      }

      .panel-title {
        max-width: 480px;
        margin-bottom: 16px;
        color: #172554;
        font-size: clamp(34px, 4vw, 49px);
        line-height: 1.14;
        font-weight: 800;
        letter-spacing: -1.6px;
      }

      .panel-title span {
        color: var(--primary);
      }

      .panel-description {
        max-width: 430px;
        margin-bottom: 20px;
        color: #526581;
        font-size: 14px;
        line-height: 1.8;
      }

      /* CSS Laptop Illustration */
      .laptop-scene {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 225px;
        margin: 0 0 18px;
      }

      .laptop-orbit {
        position: absolute;
        width: 220px;
        height: 220px;
        border: 1px dashed rgba(37, 99, 235, 0.25);
        border-radius: 50%;
      }

      .laptop-circle {
        position: absolute;
        width: 175px;
        height: 175px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
      }

      .laptop-illustration {
        position: relative;
        z-index: 2;
        width: 235px;
        text-align: center;
        transform: rotate(-5deg);
      }

      .laptop-screen {
        min-height: 150px;
        padding: 13px;
        border: 9px solid #1e293b;
        border-bottom-width: 12px;
        border-radius: 12px 12px 5px 5px;
        background: linear-gradient(135deg, #fff, #dbeafe);
        box-shadow: 0 15px 30px rgba(30, 41, 59, 0.15);
      }

      .screen-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 13px;
      }

      .screen-logo {
        color: var(--primary);
        font-size: 10px;
        font-weight: 800;
      }

      .screen-search {
        width: 75px;
        height: 8px;
        border-radius: 10px;
        background: #dbeafe;
      }

      .product-mini-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }

      .mini-product {
        min-height: 63px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 5px 2px;
        border-radius: 7px;
        background: #fff;
      }

      .mini-product i {
        color: #2563eb;
        font-size: 23px;
      }

      .mini-product span {
        color: #64748b;
        font-size: 8px;
        font-weight: 700;
      }

      .laptop-base {
        width: 112%;
        height: 12px;
        margin-left: -6%;
        border-radius: 2px 2px 12px 12px;
        background: linear-gradient(#cbd5e1, #94a3b8);
        box-shadow: 0 14px 17px rgba(30, 41, 59, 0.15);
      }

      .floating-cart,
      .floating-box {
        position: absolute;
        z-index: 3;
        width: 50px;
        height: 50px;
        display: grid;
        place-items: center;
        border: 1px solid #fff;
        border-radius: 15px;
        background: #fff;
        font-size: 23px;
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.13);
      }

      .floating-cart {
        top: 14px;
        right: 8%;
        color: #2563eb;
        transform: rotate(8deg);
      }

      .floating-box {
        bottom: 15px;
        left: 8%;
        color: #0d9488;
        transform: rotate(-8deg);
      }

      /* Benefits */
      .shopping-benefits {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 12px;
      }

      .benefit {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.65);
        color: #334e78;
        font-size: 11px;
        font-weight: 650;
      }

      .benefit i {
        color: var(--primary);
        font-size: 15px;
      }

      /* Right Register Section */
      .register-section {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 7%;
        background: #f8faff;
      }

      .register-wrapper {
        width: 100%;
        max-width: 460px;
        margin: auto;
      }

      .register-card {
        width: 100%;
        padding: 28px 30px;
        border: 1px solid #edf1f8;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 50px rgba(30, 64, 175, 0.08);
        transition: box-shadow 0.3s ease;
      }

      .register-card:hover {
        box-shadow: 0 22px 55px rgba(30, 64, 175, 0.12);
      }

      .mobile-brand {
        display: none;
        justify-content: center;
        margin-bottom: 20px;
      }

      .register-title {
        text-align: center;
        font-size: 27px;
        font-weight: 800;
        letter-spacing: -0.7px;
        color: #172554;
        margin-bottom: 7px;
      }

      .register-subtitle {
        text-align: center;
        color: #8491a7;
        font-size: 12px;
        line-height: 1.6;
        margin-bottom: 22px;
      }

      /* Form Fields */
      .field-group {
        margin-bottom: 13px;
      }

      .form-label {
        display: block;
        font-size: 12px;
        font-weight: 650;
        color: #334155;
        margin-bottom: 6px;
      }

      .input-group {
        min-height: 43px;
        border: 1px solid #e2e8f0;
        border-radius: 9px;
        overflow: hidden;
        background: #f8fafc;
        transition: 0.2s ease;
      }

      .input-group:focus-within {
        border-color: #60a5fa;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
      }

      .input-group.input-error {
        border-color: #ef4444;
        background: #fffafa;
      }

      .input-group.input-error:focus-within {
        box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.08);
      }

      .input-group-text {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 42px;
        background: transparent;
        border: none;
        color: #3b82f6;
        font-size: 15px;
        padding: 0 0 0 10px;
      }

      .form-control,
      .form-select {
        min-height: 41px;
        border: none;
        background: transparent;
        box-shadow: none !important;
        font-size: 12px;
        color: #334155;
        padding: 8px 10px;
      }

      .form-control::placeholder {
        color: #94a3b8;
        opacity: 1;
      }

      .form-control:focus,
      .form-select:focus {
        background: transparent;
      }

      .form-select {
        cursor: pointer;
      }

      /* Password Toggle */
      .password-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 40px;
        background: transparent;
        border: none;
        color: #94a3b8;
        padding: 0 10px;
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .password-toggle:hover {
        color: var(--primary);
      }

      .password-toggle:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: -4px;
        border-radius: 8px;
      }

      /* Validation Messages */
      .error-text {
        display: block;
        color: #dc2626;
        font-size: 10px;
        line-height: 1.5;
        margin-top: 4px;
        min-height: 0;
      }

      .error-text:not(:empty) {
        margin-bottom: 2px;
      }

      /* Register Button */
      .register-btn {
        display: block;
        width: 100%;
        min-height: 46px;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: #fff;
        border: none;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.2px;
        margin-top: 10px;
        box-shadow: 0 7px 16px rgba(37, 99, 235, 0.2);
        transition: 0.2s ease;
      }

      .register-btn:hover {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #fff;
        transform: translateY(-1px);
        box-shadow: 0 10px 22px rgba(37, 99, 235, 0.25);
      }

      .register-btn:active {
        transform: translateY(0);
      }

      .register-btn:focus-visible {
        outline: 3px solid rgba(59, 130, 246, 0.35);
        outline-offset: 3px;
      }

      /* Status Message */
      #message {
        font-size: 11px;
        line-height: 1.5;
      }

      /* Login Link */
      .login-text {
        text-align: center;
        margin: 17px 0 0;
        font-size: 12px;
        line-height: 1.8;
        color: #8491a7;
      }

      .login-text a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 750;
        margin-left: 3px;
      }

      .login-text a:hover {
        color: var(--primary-dark);
        text-decoration: underline;
      }

      .secure-note {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 7px;
        margin-top: 15px;
        color: #94a3b8;
        font-size: 10px;
      }

      .secure-note i {
        color: #16a34a;
      }

      /* Footer */
      .page-footer {
        padding: 13px;
        background: #fff;
        color: #94a3b8;
        font-size: 11px;
        text-align: center;
        border-top: 1px solid #edf1f8;
      }

      /* Tablet */
      @media (max-width: 1050px) {
        .shop-navbar {
          padding-right: 4%;
          padding-left: 4%;
        }

        .nav-links {
          gap: 16px;
        }

        .shopping-panel {
          padding: 35px 5%;
        }

        .register-section {
          padding: 25px 4%;
        }

        .register-card {
          padding: 25px 22px;
        }
      }

      /* Mobile */
      @media (max-width: 800px) {
        .shop-navbar {
          min-height: 70px;
          padding: 13px 18px;
        }

        .brand {
          font-size: 22px;
        }

        .brand-icon {
          width: 39px;
          height: 39px;
        }

        .nav-links {
          display: none;
        }

        .register-page {
          grid-template-columns: 1fr;
        }

        .shopping-panel {
          padding: 30px 20px 22px;
          text-align: center;
        }

        .panel-content {
          max-width: 540px;
        }

        .offer-badge {
          margin-bottom: 15px;
        }

        .panel-title {
          max-width: 500px;
          margin-right: auto;
          margin-left: auto;
          font-size: 35px;
          letter-spacing: -1px;
        }

        .panel-description {
          margin-right: auto;
          margin-left: auto;
          font-size: 13px;
        }

        .laptop-scene {
          min-height: 190px;
          max-width: 430px;
          margin: 0 auto 10px;
        }

        .laptop-orbit {
          width: 190px;
          height: 190px;
        }

        .laptop-circle {
          width: 150px;
          height: 150px;
        }

        .shopping-benefits {
          justify-content: center;
        }

        .register-section {
          padding: 25px 18px 40px;
        }

        .register-wrapper {
          max-width: 480px;
        }

        .register-card {
          padding: 28px;
        }
      }

      /* Small Mobile */
      @media (max-width: 480px) {
        body {
          font-size: 14px;
        }

        .shop-navbar {
          padding: 12px;
        }

        .brand {
          gap: 7px;
          font-size: 20px;
        }

        .brand-icon {
          width: 35px;
          height: 35px;
          font-size: 20px;
        }

        .login-link {
          gap: 4px;
          padding: 9px 11px;
          font-size: 11px;
        }

        .shopping-panel {
          padding: 27px 14px 20px;
        }

        .panel-title {
          font-size: 30px;
        }

        .panel-description {
          font-size: 12px;
        }

        .laptop-scene {
          min-height: 175px;
        }

        .laptop-illustration {
          width: 205px;
        }

        .laptop-screen {
          min-height: 135px;
          padding: 11px;
        }

        .mini-product {
          min-height: 55px;
        }

        .mini-product i {
          font-size: 20px;
        }

        .floating-cart,
        .floating-box {
          width: 40px;
          height: 40px;
          border-radius: 12px;
          font-size: 19px;
        }

        .benefit {
          padding: 8px 9px;
          font-size: 10px;
        }

        .register-section {
          padding: 20px 12px 30px;
        }

        .register-card {
          padding: 24px 18px;
          border-radius: 16px;
        }

        .register-title {
          font-size: 25px;
        }

        .register-subtitle {
          font-size: 11px;
          margin-bottom: 20px;
        }

        .field-group {
          margin-bottom: 13px;
        }

        .input-group {
          min-height: 42px;
        }

        .form-control,
        .form-select {
          font-size: 12px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="register-wrapper">
      <div class="register-card">
        <h1 class="register-title">Create Account</h1>
        <p class="register-subtitle">
          Enter your details to create your account.
        </p>

        <form id="registerForm" novalidate>
          <!-- Full Name -->
          <div class="field-group">
            <label for="fullName" class="form-label">Full Name</label>
            <div class="input-group" id="fullNameGroup">
              <span class="input-group-text">
                <i class="bi bi-person-fill"></i>
              </span>
              <input
                type="text"
                class="form-control"
                id="fullName"
                name="fullName"
                maxlength="35"
                placeholder="Enter your full name"
                oninput="this.value = this.value.replace(/[^a-zA-Z ]/g, '')"
              />
            </div>
            <span id="fullNameError" class="error-text"></span>
          </div>

          <!-- Email -->
          <div class="field-group">
            <label for="email" class="form-label">Email Address</label>
            <div class="input-group" id="emailGroup">
              <span class="input-group-text">
                <i class="bi bi-envelope-fill"></i>
              </span>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="Enter your email"
                oninput="this.value = this.value.replace(/\s/g, '')"
              />
            </div>
            <span id="emailError" class="error-text"></span>
          </div>

          <!-- Gender -->
          <div class="field-group">
            <label for="gender" class="form-label">Gender</label>
            <div class="input-group" id="genderGroup">
              <span class="input-group-text">
                <i class="bi bi-person-badge-fill"></i>
              </span>
              <select class="form-select" id="gender" name="gender">
                <option value="">Select your gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
                <option value="prefer-not-to-say">Prefer not to say</option>
              </select>
            </div>
            <span id="genderError" class="error-text"></span>
          </div>

          <!-- Phone Number -->
          <div class="field-group">
            <label for="phone" class="form-label">Phone Number</label>
            <div class="input-group" id="phoneGroup">
              <span class="input-group-text">
                <i class="bi bi-telephone-fill"></i>
              </span>
              <input
                type="text"
                class="form-control"
                id="phone"
                name="phone"
                maxlength="10"
                inputmode="numeric"
                placeholder="Enter 10-digit phone number"
                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
              />
            </div>
            <span id="phoneError" class="error-text"></span>
          </div>

          <!-- Password -->
          <div class="field-group">
            <label for="password" class="form-label">Password</label>
            <div class="input-group" id="passwordGroup">
              <span class="input-group-text">
                <i class="bi bi-lock-fill"></i>
              </span>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Enter password"
                oninput="this.value = this.value.replace(/\s/g, '')"
              />
              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('password', this)"
                aria-label="Show password"
              >
                <i class="bi bi-eye-slash"></i>
              </button>
            </div>
            <span id="passwordError" class="error-text"></span>
          </div>

          <div class="field-group">
            <label for="confirmPassword" class="form-label"
              >Confirm Password</label
            >
            <div class="input-group" id="confirmPasswordGroup">
              <span class="input-group-text">
                <i class="bi bi-shield-lock-fill"></i>
              </span>
              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm password"
                oninput="this.value = this.value.replace(/\s/g, '')"
              />
              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('confirmPassword', this)"
                aria-label="Show confirm password"
              >
                <i class="bi bi-eye-slash"></i>
              </button>
            </div>
            <span id="confirmPasswordError" class="error-text"></span>
          </div>

          <button type="submit" class="btn register-btn">
            <i class="bi bi-person-plus-fill me-1"></i>
            Register
          </button>

          <p
            id="message"
            class="text-center small mt-3 mb-0"
            aria-live="polite"
          ></p>

          <p class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
          </p>
        </form>
      </div>
    </div>

    <script>
      const registerForm = document.getElementById("registerForm");
      const message = document.getElementById("message");

      const fullNameInput = document.getElementById("fullName");
      const emailInput = document.getElementById("email");
      const genderInput = document.getElementById("gender");
      const phoneInput = document.getElementById("phone");
      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirmPassword");

      function showFieldError(fieldId, errorId, text) {
        const errorElement = document.getElementById(errorId);
        const field = document.getElementById(fieldId);
        const group = document.getElementById(fieldId + "Group");

        errorElement.textContent = text;
        if (group) group.classList.toggle("input-error", Boolean(text));
        field.setAttribute("aria-invalid", text ? "true" : "false");
      }

      function validateFullName() {
        const fullName = fullNameInput.value.trim();

        if (!fullName) {
          showFieldError("fullName", "fullNameError", "Full Name is required");
          return false;
        }

        if (!/^[A-Za-z ]+$/.test(fullName)) {
          showFieldError(
            "fullName",
            "fullNameError",
            "Only English letters and spaces are allowed",
          );
          return false;
        }

        if (fullName.replace(/ /g, "").length < 2 || fullName.length > 35) {
          showFieldError(
            "fullName",
            "fullNameError",
            "Name must contain 2 to 35 characters",
          );
          return false;
        }

        // Prevent 3 or more consecutive repeated letters
        if (/(.)\1{2,}/i.test(fullName)) {
          showFieldError(
            "fullName",
            "fullNameError",
            "Repeated characters are not allowed",
          );
          return false;
        }

        showFieldError("fullName", "fullNameError", "");
        return true;
      }

      function validateEmail() {
        const email = emailInput.value.trim().toLowerCase();

        const emailPattern = /^[a-z0-9_]+@[a-z0-9]+\.[a-z]{2,}$/;

        if (!email) {
          showFieldError("email", "emailError", "Email address is required");
          return false;
        }

        if (!emailPattern.test(email)) {
          showFieldError(
            "email",
            "emailError",
            "Only letters, numbers, underscore, @ and . are allowed",
          );
          return false;
        }

        showFieldError("email", "emailError", "");
        return true;
      }

      function validateGender() {
        if (!genderInput.value) {
          showFieldError("gender", "genderError", "Please select your gender");
          return false;
        }

        showFieldError("gender", "genderError", "");
        return true;
      }

      function validatePhone() {
        const phone = phoneInput.value.trim();

        if (!phone) {
          showFieldError("phone", "phoneError", "Phone number is required");
          return false;
        }

        if (!/^[0-9]{10}$/.test(phone)) {
          showFieldError(
            "phone",
            "phoneError",
            "Phone number must contain exactly 10 digits",
          );
          return false;
        }

        showFieldError("phone", "phoneError", "");
        return true;
      }

      function validatePassword() {
        const password = passwordInput.value;

        if (!password) {
          showFieldError("password", "passwordError", "Password is required");
          return false;
        }

        if (/\s/.test(password)) {
          showFieldError(
            "password",
            "passwordError",
            "Spaces are not allowed in password",
          );
          return false;
        }

        if (password.length <= 5 || password.length >= 15) {
          showFieldError(
            "password",
            "passwordError",
            "Password must contain 6 to 14 characters",
          );
          return false;
        }

        showFieldError("password", "passwordError", "");

        if (confirmPasswordInput.value) validateConfirmPassword();
        return true;
      }

      function validateConfirmPassword() {
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (!confirmPassword) {
          showFieldError(
            "confirmPassword",
            "confirmPasswordError",
            "Please confirm your password",
          );
          return false;
        }

        if (/\s/.test(confirmPassword)) {
          showFieldError(
            "confirmPassword",
            "confirmPasswordError",
            "Spaces are not allowed",
          );
          return false;
        }

        if (confirmPassword.length <= 5 || confirmPassword.length >= 15) {
          showFieldError(
            "confirmPassword",
            "confirmPasswordError",
            "Password must contain 6 to 14 characters",
          );
          return false;
        }

        if (password !== confirmPassword) {
          showFieldError(
            "confirmPassword",
            "confirmPasswordError",
            "Passwords do not match",
          );
          return false;
        }

        showFieldError("confirmPassword", "confirmPasswordError", "");
        return true;
      }

      function validateField(fieldId) {
        switch (fieldId) {
          case "fullName":
            return validateFullName();
          case "email":
            return validateEmail();
          case "gender":
            return validateGender();
          case "phone":
            return validatePhone();
          case "password":
            return validatePassword();
          case "confirmPassword":
            return validateConfirmPassword();
          default:
            return true;
        }
      }

      const fieldIds = [
        "fullName",
        "email",
        "gender",
        "phone",
        "password",
        "confirmPassword",
      ];

      fieldIds.forEach(function (fieldId) {
        const field = document.getElementById(fieldId);

        field.addEventListener("input", function () {
          validateField(fieldId);
          message.textContent = "";
        });

        field.addEventListener("change", function () {
          validateField(fieldId);
          message.textContent = "";
        });

        field.addEventListener("blur", function () {
          validateField(fieldId);
        });
      });

      registerForm.addEventListener("submit", function (event) {
        event.preventDefault();
        message.textContent = "";

        let isFormValid = true;

        fieldIds.forEach(function (fieldId) {
          if (!validateField(fieldId)) isFormValid = false;
        });

        if (!isFormValid) {
          message.textContent = "Please correct the errors above.";
          message.className = "text-center small mt-3 mb-0 text-danger";

          const firstInvalidField = fieldIds.find(function (fieldId) {
            return (
              document.getElementById(fieldId).getAttribute("aria-invalid") ===
              "true"
            );
          });

          if (firstInvalidField)
            document.getElementById(firstInvalidField).focus();
          return;
        }

        const fullName = fullNameInput.value.trim();
        const email = emailInput.value.trim().toLowerCase();
        const gender = genderInput.value;
        const phone = phoneInput.value.trim();
        const password = passwordInput.value;

        let users = [];

        try {
          users = JSON.parse(localStorage.getItem("users") || "[]");
          if (!Array.isArray(users)) users = [];
        } catch (error) {
          Swal.fire({
            icon: "error",
            title: "Something went wrong",
            text: "Unable to read saved users.",
          });
          return;
        }

        const existingUser = users.find(function (user) {
          return (
            user &&
            typeof user.email === "string" &&
            user.email.toLowerCase() === email
          );
        });

        if (existingUser) {
          showFieldError(
            "email",
            "emailError",
            "This email is already registered. Please login.",
          );

          Swal.fire({
            icon: "error",
            title: "Email Already Registered",
            text: "This email is already registered. Please login.",
            confirmButtonText: "OK",
            confirmButtonColor: "#dc3545",
          });

          emailInput.focus();
          return;
        }

        const newUser = {
          fullName: fullName,
          email: email,
          gender: gender,
          phone: phone,
          password: password,
        };

        users.push(newUser);

        try {
          localStorage.setItem("users", JSON.stringify(users));
        } catch (error) {
          Swal.fire({
            icon: "error",
            title: "Unable to Save",
            text: "Registration data could not be saved in this browser.",
          });
          return;
        }

        console.log("Registration successful!");
        console.log("Full Name:", fullName);
        console.log("Email:", email);
        console.log("Gender:", gender);
        console.log("Phone:", phone);

        Swal.fire({
          icon: "success",
          title: "Registration Successful!",
          text: "Your account has been created successfully.",
          confirmButtonText: "Go to Login",
          confirmButtonColor: "#2f80f7",
          allowOutsideClick: false,
        }).then(function (result) {
          if (result.isConfirmed) {
            window.location.href = "login.html";
          }
        });
      });

      function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector("i");

        if (input.type === "password") {
          input.type = "text";
          icon.classList.replace("bi-eye-slash", "bi-eye");
          button.setAttribute("aria-label", "Hide password");
        } else {
          input.type = "password";
          icon.classList.replace("bi-eye", "bi-eye-slash");
          button.setAttribute("aria-label", "Show password");
        }
      }
    </script>
  </body>
</html>
