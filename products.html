<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Products</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f8fafc;
        color: #1e293b;
        font-family: Arial, sans-serif;
      }

      /* Navbar */

      .navbar {
        background: #ffffff;
        padding: 16px 0;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      }

      .navbar-brand {
        font-size: 25px;
        font-weight: 800;
        color: #2563eb;
      }

      .navbar-brand:hover {
        color: #1d4ed8;
      }

      /* Main container */

      .main-container {
        max-width: 1400px;
        margin: auto;
        padding: 35px 20px;
      }

      .page-title {
        font-size: 30px;
        font-weight: 800;
        margin-bottom: 8px;
      }

      .page-subtitle {
        color: #64748b;
        margin-bottom: 25px;
      }

      /* Search */

      .search-box {
        position: relative;
        max-width: 420px;
        width: 100%;
      }

      .search-box input {
        width: 100%;
        padding: 12px 15px 12px 42px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        outline: none;
        background: white;
      }

      .search-box input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      .search-icon {
        position: absolute;
        top: 50%;
        left: 15px;
        transform: translateY(-50%);
        color: #64748b;
      }

      /* Buttons */

      .add-product-btn {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 9px;
        padding: 12px 18px;
        font-weight: 600;
      }

      .add-product-btn:hover {
        background: #1d4ed8;
        color: white;
      }

      .logout-btn {
        border: 1px solid #ef4444;
        color: #dc2626;
        border-radius: 8px;
        padding: 8px 14px;
        background: white;
      }

      .logout-btn:hover {
        background: #ef4444;
        color: white;
      }

      /* Product cards */

      .product-card {
        height: 100%;
        background: white;
        border: 1px solid #e8edf3;
        border-radius: 14px;
        overflow: hidden;
        transition:
          transform 0.25s,
          box-shadow 0.25s;
      }

      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.09);
      }

      .product-image {
        height: 220px;
        position: relative;
        overflow: hidden;
        background: #f1f5f9;
      }

      .product-image img {
        height: 100%;
        width: 100%;
        object-fit: cover;
        display: block;
      }

      .wishlist-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 38px;
        height: 38px;
        border: none;
        border-radius: 50%;
        background: white;
        color: #475569;
        font-size: 19px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .wishlist-btn.active {
        color: #ef4444;
      }

      .product-info {
        padding: 16px;
      }

      .product-category {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: #2563eb;
        background: #eff6ff;
        padding: 5px 8px;
        border-radius: 5px;
        margin-bottom: 10px;
      }

      .product-heading {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 10px;
      }

      .product-heading h3 {
        font-size: 17px;
        line-height: 1.4;
        font-weight: 700;
        margin: 0;
        overflow-wrap: anywhere;
      }

      .price {
        font-size: 16px;
        font-weight: 800;
        color: #15803d;
        white-space: nowrap;
      }

      .product-description {
        font-size: 13px;
        line-height: 1.6;
        color: #64748b;
        min-height: 42px;
        margin-bottom: 12px;
        overflow-wrap: anywhere;
      }

      .rating {
        margin-bottom: 15px;
        color: #f59e0b;
        font-size: 17px;
      }

      .cart-btn {
        width: 100%;
        border: 1px solid #2563eb;
        background: white;
        color: #2563eb;
        border-radius: 8px;
        padding: 10px;
        font-weight: 600;
        transition: 0.2s;
      }

      .cart-btn:hover,
      .cart-btn.active-cart {
        background: #2563eb;
        color: white;
      }

      /* Empty state */

      .empty-state {
        padding: 65px 20px;
        text-align: center;
        background: white;
        border: 1px dashed #cbd5e1;
        border-radius: 14px;
      }

      .empty-state i {
        font-size: 48px;
        color: #94a3b8;
      }

      .empty-state h3 {
        margin-top: 15px;
        font-size: 22px;
        font-weight: 700;
      }

      .empty-state p {
        color: #64748b;
      }

      /* Image preview */

      #imagePreview {
        width: 130px;
        height: 130px;
        object-fit: cover;
        border-radius: 10px;
      }

      .form-label {
        font-weight: 600;
        font-size: 14px;
      }

      .modal-content {
        border: none;
        border-radius: 14px;
        overflow: hidden;
      }

      .modal-header {
        background: #f8fafc;
      }

      footer {
        margin-top: 40px;
        padding: 22px;
        text-align: center;
        color: #64748b;
        background: white;
        border-top: 1px solid #e2e8f0;
      }

      /* Mobile responsive */

      @media (max-width: 576px) {
        .main-container {
          padding: 25px 12px;
        }

        .page-title {
          font-size: 25px;
        }

        .product-image {
          height: 155px;
        }

        .product-info {
          padding: 11px;
        }

        .product-heading {
          flex-direction: column;
          gap: 5px;
        }

        .product-heading h3 {
          font-size: 15px;
        }

        .price {
          font-size: 15px;
        }

        .product-description {
          font-size: 12px;
        }

        .navbar-brand {
          font-size: 21px;
        }
      }
    </style>
  </head>

  <body>
    <!-- ===================================
       NAVBAR
  ==================================== -->

    <nav class="navbar">
      <div
        class="container d-flex justify-content-between align-items-center gap-3"
      >
        <a href="products.html" class="navbar-brand text-decoration-none">
          <i class="bi bi-shop"></i> MyStore
        </a>

        <button type="button" class="logout-btn" id="logoutButton">
          <i class="bi bi-box-arrow-right"></i>
          Logout
        </button>
      </div>
    </nav>

    <!-- ===================================
       MAIN CONTENT
  ==================================== -->

    <main class="main-container">
      <!-- Page heading -->

      <div class="mb-4">
        <h1 class="page-title">Our Products</h1>

        <p class="page-subtitle">
          Discover products and add your own items to the store.
        </p>
      </div>

      <!-- Search and Add Product -->

      <div
        class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4"
      >
        <div class="search-box">
          <i class="bi bi-search search-icon"></i>

          <input
            type="search"
            id="searchInput"
            placeholder="Search products..."
            aria-label="Search products"
          />
        </div>

        <button
          type="button"
          class="btn add-product-btn"
          data-bs-toggle="modal"
          data-bs-target="#addProductModal"
        >
          <i class="bi bi-plus-circle"></i>
          Add Product
        </button>
      </div>

      <!-- Product list -->

      <div class="row g-3" id="productList"></div>

      <!-- Empty message -->

      <div class="empty-state d-none" id="emptyMessage">
        <i class="bi bi-bag"></i>

        <h3>No Products Found</h3>

        <p>Add your first product or try a different search.</p>

        <button
          type="button"
          class="btn add-product-btn mt-2"
          data-bs-toggle="modal"
          data-bs-target="#addProductModal"
        >
          <i class="bi bi-plus-circle"></i>
          Add Your First Product
        </button>
      </div>
    </main>

    <!-- ===================================
       ADD PRODUCT MODAL
  ==================================== -->

    <div
      class="modal fade"
      id="addProductModal"
      tabindex="-1"
      aria-labelledby="addProductModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="addProductModalLabel">
              <i class="bi bi-plus-circle text-primary"></i>
              Add New Product
            </h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <form id="addProductForm">
              <!-- Image -->

              <div class="mb-3">
                <label for="productImage" class="form-label">
                  Product Image *
                </label>

                <input
                  type="file"
                  id="productImage"
                  class="form-control"
                  accept="image/*"
                  required
                />

                <div class="form-text">Select an image smaller than 2 MB.</div>

                <img
                  id="imagePreview"
                  src=""
                  alt="Product preview"
                  class="img-thumbnail mt-3 d-none"
                />
              </div>

              <!-- Name -->

              <div class="mb-3">
                <label for="productName" class="form-label">
                  Product Name *
                </label>

                <input
                  type="text"
                  id="productName"
                  class="form-control"
                  placeholder="e.g. Wireless Headphones"
                  minlength="2"
                  maxlength="100"
                  required
                />
              </div>

              <!-- Price -->

              <div class="mb-3">
                <label for="productPrice" class="form-label">
                  Product Price (₹) *
                </label>

                <input
                  type="number"
                  id="productPrice"
                  class="form-control"
                  placeholder="e.g. 1499"
                  min="0.01"
                  step="0.01"
                  required
                />
              </div>

              <!-- Description -->

              <div class="mb-3">
                <label for="productDescription" class="form-label">
                  Product Description
                </label>

                <textarea
                  id="productDescription"
                  class="form-control"
                  rows="3"
                  maxlength="500"
                  placeholder="Describe your product..."
                ></textarea>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-check-circle"></i>
                Save Product
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- ===================================
       FOOTER
  ==================================== -->

    <footer>
      &copy; <span id="currentYear"></span> MyStore. All rights reserved.
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      if (sessionStorage.getItem("isLoggedIn") !== "true") {
        window.location.replace("login.html");
      }

      const productList = document.getElementById("productList");
      const emptyMessage = document.getElementById("emptyMessage");
      const searchInput = document.getElementById("searchInput");
      const logoutButton = document.getElementById("logoutButton");

      const addProductForm = document.getElementById("addProductForm");
      const productImage = document.getElementById("productImage");
      const imagePreview = document.getElementById("imagePreview");

      let allProducts = [];

      function loadProducts() {
        try {
          const savedProducts = localStorage.getItem("products");

          allProducts = savedProducts ? JSON.parse(savedProducts) : [];

          if (!Array.isArray(allProducts)) {
            allProducts = [];
          }
        } catch (error) {
          allProducts = [];

          console.error("Unable to load products:", error);
        }

        displayProducts(allProducts);
      }

      function displayProducts(products) {
        productList.replaceChildren();

        if (products.length === 0) {
          emptyMessage.classList.remove("d-none");

          return;
        }

        emptyMessage.classList.add("d-none");

        products.forEach(function (product) {
          const column = document.createElement("div");

          column.className = "col-6 col-md-4 col-lg-3";

          const card = document.createElement("div");

          card.className = "product-card";

          const imageBox = document.createElement("div");

          imageBox.className = "product-image";

          const img = document.createElement("img");

          img.alt = product.name || "Product image";

          img.loading = "lazy";

          img.src =
            product.image || "https://placehold.co/300x300?text=No+Image";

          img.onerror = function () {
            img.onerror = null;

            img.src =
              "https://placehold.co/300x300/f1f5f9/64748b?text=No+Image";
          };

          const wishlist = document.createElement("button");

          wishlist.type = "button";

          wishlist.className = "wishlist-btn";

          wishlist.setAttribute("aria-label", "Add to wishlist");

          const heart = document.createElement("i");

          heart.className = "bi bi-heart";

          wishlist.appendChild(heart);

          imageBox.append(img, wishlist);

          const info = document.createElement("div");

          info.className = "product-info";

          const category = document.createElement("span");

          category.className = "product-category";

          category.textContent = "Featured Product";

          const heading = document.createElement("div");

          heading.className = "product-heading";

          const name = document.createElement("h3");

          name.textContent = product.name || "Unnamed Product";
          s;

          const price = document.createElement("span");

          price.className = "price";

          const productPrice = Number(product.price);

          price.textContent = Number.isFinite(productPrice)
            ? "₹" + productPrice.toFixed(2)
            : "₹0.00";

          heading.append(name, price);

          const description = document.createElement("p");

          description.className = "product-description";

          description.textContent =
            product.description || "No description available.";

          const rating = document.createElement("div");

          rating.className = "rating";

          const ratingValue = Math.max(
            0,
            Math.min(5, Number(product.rating) || 0),
          );

          const stars = document.createElement("span");

          stars.textContent =
            "★".repeat(Math.floor(ratingValue)) +
            "☆".repeat(5 - Math.floor(ratingValue));

          rating.appendChild(stars);

          const cartButton = document.createElement("button");

          cartButton.type = "button";

          cartButton.className = "cart-btn";

          cartButton.innerHTML = '<i class="bi bi-cart-plus"></i> Add to Cart';

          wishlist.addEventListener("click", function () {
            const isActive = wishlist.classList.toggle("active");

            heart.classList.toggle("bi-heart", !isActive);

            heart.classList.toggle("bi-heart-fill", isActive);

            wishlist.setAttribute(
              "aria-label",
              isActive ? "Remove from wishlist" : "Add to wishlist",
            );
          });

          cartButton.addEventListener("click", function () {
            cartButton.classList.add("active-cart");

            cartButton.innerHTML =
              '<i class="bi bi-check-circle-fill"></i> Added!';
          });

          info.append(category, heading, description, rating, cartButton);

          card.append(imageBox, info);

          column.appendChild(card);

          productList.appendChild(column);
        });
      }

      searchInput.addEventListener("input", function () {
        const searchValue = searchInput.value.trim().toLowerCase();

        const filteredProducts = allProducts.filter(function (product) {
          const name = String(product.name || "").toLowerCase();

          const description = String(product.description || "").toLowerCase();

          return (
            name.includes(searchValue) || description.includes(searchValue)
          );
        });

        displayProducts(filteredProducts);
      });

      productImage.addEventListener("change", function () {
        const file = productImage.files[0];

        imagePreview.src = "";

        imagePreview.classList.add("d-none");

        if (!file) {
          return;
        }

        if (!file.type.startsWith("image/")) {
          alert("Please select a valid image.");

          productImage.value = "";

          return;
        }

        if (file.size > 2 * 1024 * 1024) {
          alert("Image size must be less than 2 MB.");

          productImage.value = "";

          return;
        }

        const reader = new FileReader();

        reader.onload = function (event) {
          imagePreview.src = event.target.result;

          imagePreview.classList.remove("d-none");
        };

        reader.readAsDataURL(file);
      });

      addProductForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const file = productImage.files[0];

        const name = document.getElementById("productName").value.trim();

        const price = Number(document.getElementById("productPrice").value);

        const description = document
          .getElementById("productDescription")
          .value.trim();

        if (!file || !file.type.startsWith("image/")) {
          alert("Please select a valid product image.");

          return;
        }

        if (file.size > 2 * 1024 * 1024) {
          alert("Image size must be less than 2 MB.");

          return;
        }

        if (name.length < 2) {
          alert("Product name must contain at least 2 characters.");

          return;
        }

        if (!Number.isFinite(price) || price <= 0) {
          alert("Please enter a valid product price.");

          return;
        }

        const reader = new FileReader();

        reader.onload = function (event) {
          const newProduct = {
            id: Date.now(),

            name: name,

            price: price,

            description: description,

            image: event.target.result,

            rating: 0,
          };

          try {
            const savedProducts = JSON.parse(
              localStorage.getItem("products") || "[]",
            );

            if (!Array.isArray(savedProducts)) {
              throw new Error("Invalid products data");
            }

            savedProducts.push(newProduct);

            localStorage.setItem("products", JSON.stringify(savedProducts));

            allProducts = savedProducts;

            searchInput.value = "";

            displayProducts(allProducts);

            addProductForm.reset();

            imagePreview.src = "";

            imagePreview.classList.add("d-none");

            const modalElement = document.getElementById("addProductModal");

            const modalInstance = bootstrap.Modal.getInstance(modalElement);

            if (modalInstance) {
              modalInstance.hide();
            }

            alert("Product added successfully!");
          } catch (error) {
            console.error("Unable to save product:", error);

            alert(
              "Unable to save product. Browser storage may be full. Try a smaller image.",
            );
          }
        };

        reader.onerror = function () {
          alert("Unable to read the selected image.");
        };

        reader.readAsDataURL(file);
      });

      logoutButton.addEventListener("click", function () {
        sessionStorage.removeItem("isLoggedIn");

        sessionStorage.removeItem("loggedInUser");

        window.location.replace("login.html");
      });

      document.getElementById("currentYear").textContent =
        new Date().getFullYear();

      if (sessionStorage.getItem("isLoggedIn") === "true") {
        loadProducts();
      }
    </script>
  </body>
</html>
